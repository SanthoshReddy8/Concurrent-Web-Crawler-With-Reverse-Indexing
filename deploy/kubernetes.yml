apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crawler-search
  template:
    metadata:
      labels:
        app: crawler-search
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: ghcr.io/OWNER/concurrent-web-crawler:latest
          args: ["serve", "--port", "7000", "--redis-host", "redis", "--redis-port", "6379"]
          ports:
            - containerPort: 7000
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 7000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 7000 }
            initialDelaySeconds: 15
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-search
spec:
  selector: { app: crawler-search }
  ports:
    - port: 80
      targetPort: 7000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379